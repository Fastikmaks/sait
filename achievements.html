<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения | Арутюнян М.К.</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="section__title">Достижения</h1>
                
                <div class="grid grid--achievements">
                    <article class="card achievement-card achievement-card--main">
                        <div class="achievement-card__icon">
                            <img src="assets/images/icon-trophy.png" alt="">
                        </div>
                        <h3 class="achievement-card__title">Профессиональные достижения</h3>
                        <ul class="achievement-list">
                            <li><strong>III место</strong> — Учитель года — 2025 (муниципальный этап)</li>
                            <li>Участие в проекте «Музейный хаб»</li>
                            <li>Грант на реализацию социального проекта</li>
                        </ul>
                    </article>

                    <a href="diplomas.html" class="card achievement-card achievement-card--link">
                        <div class="achievement-card__icon">
                            <img src="assets/images/icon-diploma.png" alt="">
                        </div>
                        <span class="achievement-card__label">Грамоты</span>
                    </a>

                    <a href="certificates.html" class="card achievement-card achievement-card--link">
                        <div class="achievement-card__icon">
                            <img src="assets/images/icon-certificate.png" alt="">
                        </div>
                        <span class="achievement-card__label">Сертификаты</span>
                    </a>

                    <a href="students.html" class="card achievement-card achievement-card--link">
                        <div class="achievement-card__icon">
                            <img src="assets/images/icon-star.png" alt="">
                        </div>
                        <span class="achievement-card__label">Достижения учеников</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
</body>
</html>
